project_name: "ARES: Adversarial Self-Play for Software Analysis"
version: "0.1.0"

self_play:
  default_turns: 25
  exam_interval: 25          # Run external benchmark exam every N turns (and at baseline turn 0)
  run_baseline_exam: true
  in_context_history_window: 6
  elo_initial_rating: 1200.0
  elo_k_factor: 32.0
  blind_attacker: false      # Hide unit test cases from AttackerAgent prompt
  blind_defender: false      # Hide failing test details from DefenderAgent prompt
  strict_llm: true           # Stop with an error instead of falling back to AST heuristics; use --no-strict-llm for a labelled no-LLM baseline

referee:
  deterministic: true
  min_broken_tests_for_valid_attack: 1
  max_broken_tests_for_valid_attack: 2
  expected_tests_per_problem: 5
  execution_timeout_seconds: 3.0
  rewards:
    # Attacker rewards
    valid_attack_evaded_defender: 1.0        # 1-2 tests broken AND Defender failed to repair all tests
    valid_attack_caught_by_defender: 0.25    # 1-2 tests broken (valid subtle injection), but Defender repaired it
    invalid_attack_no_tests_broken: -0.8     # 0 tests broken (attack had no effect)
    invalid_attack_too_many_broken: -0.9     # >2 tests broken (attack was too obvious / destructive)
    invalid_attack_syntax_error: -1.0        # Code failed to parse or timed out

    # Defender rewards
    defender_full_repair_and_classify: 1.0   # Repaired 100% of tests AND classified defect type accurately
    defender_full_repair_only: 0.75          # Repaired 100% of tests, partial/different defect classification
    defender_partial_repair: -0.3            # Improved pass rate but did not pass 100% of tests
    defender_failed_repair: -0.8             # Failed to repair the broken tests
    defender_clean_passthrough: 0.5          # Correctly preserved clean code when attacker failed to break tests

memory:
  # Supported backends: "auto" (use real Cognee if installed & reachable, else local_graph),
  # "cognee" (strict real Cognee SDK: add/cognify/search; raises if unavailable),
  # "local_graph" (honest local SQLite + AST/Diff episodic graph store).
  backend: "auto"
  portable_store_dir: "memory_store"
  portable_bundle_file: "memory_store/cognee_portable_graph.json"
  top_k_memories: 4
  cognee_embedding_provider: null  # Defaults to LLM provider; set "ollama" for local embeddings + remote LLM
  cognee_embedding_model: "nomic-embed-text"
  cognee_embedding_dimensions: 768
  cognee_search_type: "CHUNKS"
  cognify_interval: 1
  auto_export_portable_snapshot: true

llm:
  # Supported modes: "auto", "ollama", "openai_compatible", "adaptive_local"
  # "auto" detects Ollama vs OpenAI-compatible endpoints; if unreachable, stops with an error
  # while strict_llm: true (or falls back to "adaptive_local" when --no-strict-llm is passed)
  mode: "auto"
  timeout_seconds: 60.0
  num_ctx: 8192
  attacker_model:
    provider: "ollama"
    model_name: "qwen2.5-coder:7b"
    base_url: "http://localhost:11434"
    temperature: 0.7
  defender_model:
    provider: "ollama"
    model_name: "qwen2.5-coder:7b"
    base_url: "http://localhost:11434"
    temperature: 0.2

datasets:
  self_play_dataset_path: "ares/datasets/mlcq_technical_debt_suite.json"
  external_exam_dataset_path: "ares/datasets/external_exam_benchmark.json"

logging:
  output_dir: "outputs"
  turns_log_file: "outputs/self_play_turns.jsonl"
  exam_log_file: "outputs/external_exams.json"
  scoreboard_file: "outputs/scoreboard_summary.json"

